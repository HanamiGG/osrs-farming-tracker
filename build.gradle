plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.headroomai.farmwatch'
version = '0.2.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Write the Gradle project version into a classpath resource so the plugin
// doesn't have to hardcode its own version string in Java. JsonCodec reads
// this at runtime and ships it to the dashboard as `pluginVersion`.
tasks.register('writeVersionResource') {
    def outFile = layout.buildDirectory.file('generated-resources/farmwatch-version.properties')
    outputs.file(outFile)
    inputs.property('version', version)
    doLast {
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        f.text = "version=${version}\n"
    }
}

sourceSets {
    main {
        resources {
            srcDir layout.buildDirectory.dir('generated-resources')
        }
    }
}

processResources.dependsOn tasks.named('writeVersionResource')

tasks.register('runClient', JavaExec) {
    group = 'runelite'
    description = 'Runs the RuneLite client with the Farmwatch plugin side-loaded.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.headroomai.farmwatch.FarmwatchPluginTest'
    // RuneLite's ExternalPluginManager.loadBuiltin requires JVM assertions
    // to be enabled so dev-mode plugins catch API misuse early.
    jvmArgs = ['-ea']
    // --developer-mode enables the sidebar "Add Jagex Account" button and
    // developer tools pane. Required if you log in via a Jagex Account
    // (the mandatory flow for post-2023 accounts).
    args = ['--developer-mode']
}
