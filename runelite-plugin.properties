description=Mirrors the stock Time Tracking farming data two ways: as JSON snapshots on disk (~/.runelite/osrs-farming-tracker) and over a loopback HTTP server on 127.0.0.1 that a companion web dashboard reads from. The server is enabled by default so the dashboard works first-launch; it binds to 127.0.0.1 only (never 0.0.0.0), enforces a user-editable CORS allowlist, and exposes only read-only JSON endpoints. Both outputs can be toggled off in config. Reads only, no writes to game state or to the stock Time Tracking plugin's config.
tags=farming,timers,tracker,web,dashboard,export,json
plugins=com.headroomai.farmwatch.FarmwatchPlugin
build=standard
