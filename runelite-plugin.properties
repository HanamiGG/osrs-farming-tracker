support=https://github.com/HanamiGG/osrs-farming-tracker/issues
description=Sidebar Potion Planner for ironman accounts, with a built-in farming-patch mirror driving the "have / growing / short" math. The planner lists ~16 common potions (Super combat, Divine ranging, Prayer, Stamina, Zamorak brew, ...), reads your bank snapshot to show what you already have, and reads your farming patches to tell you which herbs are already growing and roughly when they'll be ready using the OSRS chance-to-save-a-life yield formula. The farming data is also mirrored to disk as JSON snapshots (~/.runelite/osrs-farming-tracker) and over a loopback HTTP server on 127.0.0.1 that a companion web dashboard reads from. The server is enabled by default so the dashboard works first-launch; it binds to 127.0.0.1 only (never 0.0.0.0), enforces a user-editable CORS allowlist, and exposes only read-only JSON endpoints. Both outputs can be toggled off in config. Reads only, no writes to game state or to the stock Time Tracking plugin's config.
tags=potion,planner,ironman,herblore,farming,timers,tracker,web,dashboard,export,json
plugins=com.headroomai.farmwatch.FarmwatchPlugin
build=standard
